<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiln — 纸面层示范：登录</title>

<!-- 纸面层可以引入 Noto Serif SC，条件是同族同源、只用于 display/title、正文仍走 sans。
     这是 platform-mapping.md 里「字体家族属于可变层」的一次合法使用，不是新开一套字体系统。 -->
<style>@import url("https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap");</style>
<style>@import url("../tokens/fonts.css");</style>
<style>@import url("../tokens/index.css");</style>
<!-- 纸面 token 是显式加载的第二层 —— 工作台页面拿不到它，两层的契约才各自锋利。 -->
<style>@import url("../tokens/paper.css");</style>

<style>
/* ============================================================
   纸面层示范：登录页。

   这一层的硬规矩，在这份 CSS 里都能指出来：
     ① 没有一个 box-shadow —— 纸不会浮在纸上面。
     ② 只有一个高饱和锚点 —— 提交按钮。
     ③ 留白是连续的大块，不是摊薄的行距。
     ④ 层次靠 --paper / --paper-deep 换面，而且这个色差必须**微弱到被版面
        契约当成同一张纸**。纸与台面之间不该有一道能被当成边界读的线 ——
        那是卡片的语言，不是纸的语言。
   ============================================================ */

body {
  background: var(--paper-deep);        /* 台面 */
  color: var(--paper-foreground);
  font-size: var(--text-paper-body);
}

.desk {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-8) var(--space-6);
}

/* 一张有幅面的纸：ISO 216 的 1 : √2，通高摆在台面中央。
   给它明确的幅面，是为了让「留白」有归属 —— 白不再是屏幕的剩余空间，
   而是这张纸上被有意留下的部分。 */
.sheet {
  background: var(--paper);
  height: min(820px, calc(100vh - var(--space-16)));
  aspect-ratio: 1 / 1.414;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  padding: var(--space-12) var(--space-12) var(--space-8);
  position: relative;

  /* 纸纹两层：极细网点 + 手工纸的帘纹。
     两层都必须轻到**看不出图案**。第一版帘纹用满强度的 --paper-grain、周期 3px，
     墨占比断言照样通过（纹理的 alpha 低于墨阈值），但肉眼一看就是横线信纸 ——
     那已经越过了「颗粒必须极轻」这条规矩。门只抓得住重度违规，这一步要人眼复核。
     所以帘纹在 grain 基础上再稀释一半，周期拉到 4px。 */
  background-image:
    radial-gradient(var(--paper-grain) 0.5px, transparent 0.5px),
    repeating-linear-gradient(
      to bottom,
      color-mix(in srgb, var(--paper-grain) 45%, transparent) 0 1px,
      transparent 1px 4px
    );
  background-size: 4px 4px, 100% 4px;
}

/* 天头与地脚：印刷版心的上下界。这是纸的结构线，不是分隔卡片的边框。 */
.folio-rule {
  height: 1px;
  background: var(--paper-edge);
  flex: none;
}

.folio {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: var(--space-8) 0 var(--space-4);
  min-height: 0;
}

/* 主体落在版心的上半部 —— 天头小于地脚，视觉重心略高于几何中心，
   这是书籍版式的惯例，眼睛读起来比正中更稳。 */
.block { width: 300px; }

.eyebrow {
  margin: 0 0 var(--space-3);
  font-size: var(--text-tiny);
  color: var(--paper-muted);
  letter-spacing: 0.32em;               /* 分散字距：书籍扉页的题署 */
  text-indent: 0.32em;
}

h1.title {
  margin: 0 0 var(--space-12);
  font-family: "Noto Serif SC", var(--font-sans);   /* 衬线只出现在 title 上 */
  font-size: var(--text-title);
  font-weight: var(--weight-medium);
  line-height: var(--leading-tight);
  letter-spacing: 0.08em;
}

.form { display: flex; flex-direction: column; gap: var(--space-4); }

.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field-label {
  font-size: var(--text-tiny);
  color: var(--paper-muted);
  letter-spacing: 0.14em;
}

/* 输入框：印刷的**下划线**，不是屏幕的方框。
   四边框是控件的语言；一条底线是表单在纸上的语言 —— 填空题就是这么印的。 */
.input {
  height: var(--paper-control-height);
  padding: 0 var(--space-1);
  border: 0;
  border-bottom: 1px solid var(--paper-rule);
  border-radius: 0;
  background: transparent;
  font-family: inherit;
  font-size: var(--text-paper-body);
  color: var(--paper-foreground);
  width: 100%;
}
.input::placeholder { color: var(--paper-muted); }
/* 焦点：加重那条底线，不用 box-shadow —— 这一层禁用一切柔光阴影，焦点环也不例外。 */
.input:focus { outline: none; border-bottom-color: var(--primary); border-bottom-width: 2px; }
.input:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }

.input-wrap { position: relative; }
.input-wrap .input { padding-right: var(--space-8); }

/* 嵌在输入框边界内的图标控件：静止透明无边框（工作台层同款 quiet 例外）。 */
.eye {
  position: absolute; right: 0; top: 50%;
  transform: translateY(-50%);
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0;
  color: var(--paper-muted);
  cursor: pointer;
}
.eye:hover { color: var(--paper-foreground); }
.eye:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

/* 唯一的锚点，形态是**一枚印章**而不是一条网页按钮。
   撑满整行的红色块在纸上像贴了张标签：面积一大，它就从「锚点」变成了「色域」，
   而锚点的力量来自稀缺。收窄到内容需要的宽度，红的总量降下来，它反而更跳。 */
.submit {
  align-self: flex-start;
  height: var(--paper-control-height);
  min-width: 132px;
  padding: 0 var(--space-6);
  margin-top: var(--space-6);
  border: 0;
  border-radius: var(--radius-control);
  background: var(--primary);
  color: var(--primary-foreground);
  font-family: inherit;
  font-size: var(--text-paper-body);
  font-weight: var(--weight-medium);
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  cursor: pointer;
}
.submit:active { transform: translateY(1px); }
.submit:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

.aux { margin: var(--space-4) 0 0; font-size: var(--text-tiny); }
.aux a { color: var(--paper-muted); text-decoration: none; letter-spacing: 0.08em; }
.aux a:hover { color: var(--paper-foreground); text-decoration: underline; }

/* 地脚：版权像书籍的版口，贴地脚线、分散字距、极淡。 */
.colophon {
  margin-top: auto;
  font-size: var(--text-tiny);
  color: var(--paper-muted);
  letter-spacing: 0.24em;
  text-indent: 0.24em;
}

.icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.4; }

/* 移动端：台面消失，纸铺满小屏 —— 一张纸就是整个屏幕。
   幅面比例在这里必须让位，否则纸会缩成一个小方块，四周全是台面。 */
@media (max-width: 600px) {
  .desk { padding: 0; }
  .sheet {
    height: 100vh;
    aspect-ratio: auto;
    width: 100%;
    padding: var(--space-8) var(--space-6) var(--space-6);
  }
  .folio { padding: var(--space-6) 0 var(--space-2); }
  .block { width: 100%; }
  h1.title { margin-bottom: var(--space-8); }
}
</style>
</head>
<body>

<div class="desk">
  <main class="sheet">
    <div class="folio-rule"></div>

    <div class="folio">
      <div class="block">
        <p class="eyebrow">窑务工作台</p>
        <h1 class="title">登录</h1>

        <form class="form" onsubmit="return false">
          <div class="field">
            <label class="field-label" for="acct">账号</label>
            <input class="input" id="acct" type="text" autocomplete="username" placeholder="手机号或邮箱">
          </div>

          <div class="field">
            <label class="field-label" for="pw">密码</label>
            <div class="input-wrap">
              <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="请输入密码">
              <button class="eye" id="eye" type="button" aria-label="显示密码">
                <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg>
              </button>
            </div>
          </div>

          <button class="submit" type="submit">登录</button>
        </form>

        <p class="aux"><a href="#">忘记密码</a></p>
      </div>

      <div class="colophon">窑务工作台 · 运营中心</div>
    </div>

    <div class="folio-rule"></div>
  </main>
</div>

<script>
const pw = document.getElementById("pw");
const eye = document.getElementById("eye");
eye.addEventListener("click", () => {
  const shown = pw.type === "text";
  pw.type = shown ? "password" : "text";
  eye.setAttribute("aria-label", shown ? "显示密码" : "隐藏密码");
});
</script>
</body>
</html>
